name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html style.css favicon.svg LICENSE src _site/
          # Stamp the commit into every CSS/JS URL, so a fresh page never runs
          # with stale cached files (Pages lets browsers cache for 10 minutes).
          v=${GITHUB_SHA::8}
          sed -i "s#href=\"style.css\"#href=\"style.css?v=$v\"#; s#src=\"src/main.js\"#src=\"src/main.js?v=$v\"#" _site/index.html
          sed -i -E "s#(from '\./[a-z]+\.js)'#\1?v=$v'#; s#(new URL\('\./worker\.js)'#\1?v=$v'#" _site/src/*.js
          grep -q "src/main.js?v=$v" _site/index.html
          ! grep -nE "from '\./[a-z]+\.js'|URL\('\./worker\.js'" _site/src/*.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
